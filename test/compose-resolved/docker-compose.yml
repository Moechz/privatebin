# ===========================================================================
# PrivateBin for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : privatebin/nginx-fpm-alpine:2.1.1 (Docker Hub, used unmodified)
#                  -> https://github.com/PrivateBin/PrivateBin
#
# Ports   : host 8177 -> container 8080. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/privatebindocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
#           data/ holds the encrypted pastes; cfg/ is where an optional
#           conf.php goes (limits, retention, storage backend).
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the image serves the app with nginx on port 80 (unusable as uid 1000). This
#           wrapper runs the built-in PHP web server on port 8080 and keeps the paste storage
#           on the mounted volume.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  privatebindocker:
    image: privatebin/nginx-fpm-alpine:2.1.1
    container_name: privatebindocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # ===========================================================================
        # PrivateBin entrypoint for a non-root container (TOS 7 requirement).
        #
        # The upstream image serves the app with nginx on port 80. A non-root
        # container cannot bind port 80, so this wrapper serves the same document
        # root (/var/www) with PHP's built-in web server on port 8080 and keeps the
        # paste storage on the mounted volume (/srv/data).
        #
        # The web server is started as a *child* instead of being exec'ed into PID 1.
        # A process that is PID 1 gets no default signal handling, so `docker stop`
        # used to wait out the whole grace period and then SIGKILL the container
        # (review finding F3, "service fails to stop cleanly"). The wrapper stays in
        # PID 1, forwards SIGTERM/SIGINT to the server and exits 0 once it is gone.
        # ===========================================================================
        set -e
        set -u

        DATA=/srv/data
        mkdir -p "$$DATA" 2>/dev/null || true

        if ! ( : > "$$DATA/.write-test" ) 2>/dev/null; then
          echo "privatebin: $$DATA is not writable by uid $$(id -u)" >&2
          exit 1
        fi
        rm -f "$$DATA/.write-test"

        # The image ships php as /usr/local/bin/php; older tags used php85.
        PHP=php
        command -v php85 >/dev/null 2>&1 && PHP=php85

        cd /var/www
        "$$PHP" -S 0.0.0.0:8080 -t /var/www &
        server=$$!

        shutdown=0
        on_signal() {
          shutdown=1
          kill -TERM "$$server" 2>/dev/null || true
        }
        trap on_signal TERM INT

        status=0
        wait "$$server" || status=$$?

        if [ "$$shutdown" -eq 1 ]; then
          # give the server a moment to release the socket, then report a clean stop
          n=0
          while kill -0 "$$server" 2>/dev/null && [ "$$n" -lt 50 ]; do
            sleep 0.1
            n=$$((n + 1))
          done
          status=0
        fi

        exit "$$status"
    ports:
      - "8177:8080"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/privatebindocker/data:/srv/data
      - /Volume1/DockerAppData/privatebindocker/cfg:/srv/cfg
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90' /proc/net/tcp6 || grep -q ':1F90' /proc/net/tcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8177
    protocol: http
